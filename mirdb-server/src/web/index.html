<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirDB Web Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- Skip navigation link for keyboard accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header role="banner">
        <h1>MirDB Web Dashboard</h1>
    </header>

    <main id="main-content" role="main">
        <!-- Server Status Panel (Scenario 1) -->
        <section id="status-panel" class="panel" aria-label="Server Status">
            <h2>Server Status</h2>
            <div id="status-content" class="status-grid">
                <div class="status-item">
                    <span class="status-label">Level 0 files</span>
                    <span id="level-0-files" class="status-value">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Level 1 files</span>
                    <span id="level-1-files" class="status-value">-</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Memory Usage</span>
                    <span id="memory-usage" class="status-value">-</span>
                </div>
            </div>
            <button id="refresh-status" type="button" aria-label="Refresh server status">
                Refresh Status
            </button>
        </section>

        <!-- Get Key Panel (Scenario 2) -->
        <section id="get-panel" class="panel" aria-label="Get Key">
            <h2>Get Key</h2>
            <form id="get-key-form" aria-describedby="get-key-help" novalidate>
                <div class="form-group">
                    <label for="get-key-input">Key</label>
                    <input type="text" id="get-key-input" name="key"
                           placeholder="Enter key name" required
                           aria-required="true">
                    <span id="get-key-error" class="error-message" role="alert" aria-live="polite"></span>
                </div>
                <button type="submit" id="lookup-btn">Lookup</button>
            </form>
            <div id="get-result" class="result-box" aria-live="polite">
                <!-- Result will be displayed here -->
            </div>
            <!-- Delete button (Scenario 4) - shown after successful lookup -->
            <div id="delete-action" class="delete-action" style="display: none;">
                <button type="button" id="delete-btn" class="delete-btn" aria-label="Delete this key">
                    Delete Key
                </button>
            </div>
            <!-- Delete confirmation dialog (Scenario 4) -->
            <div id="delete-confirm-dialog" class="confirm-dialog" style="display: none;" role="dialog" aria-labelledby="delete-dialog-title" aria-modal="true">
                <div class="dialog-content">
                    <h3 id="delete-dialog-title">Confirm Deletion</h3>
                    <p id="delete-confirm-message">Are you sure you want to delete this key?</p>
                    <div class="dialog-buttons">
                        <button type="button" id="delete-confirm-btn" class="confirm-btn">Delete</button>
                        <button type="button" id="delete-cancel-btn" class="cancel-btn">Cancel</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Set Key Panel (Scenario 3) -->
        <section id="set-panel" class="panel" aria-label="Set Key">
            <h2>Set Key</h2>
            <form id="set-key-form" aria-describedby="set-key-help" novalidate>
                <div class="form-group">
                    <label for="set-key-input">Key</label>
                    <input type="text" id="set-key-input" name="key"
                           placeholder="Enter key name" required
                           aria-required="true">
                    <span id="set-key-error" class="error-message" role="alert" aria-live="polite"></span>
                </div>
                <div class="form-group">
                    <label for="set-value-input">Value</label>
                    <textarea id="set-value-input" name="value"
                              placeholder="Enter value" rows="3"
                              aria-describedby="value-help"></textarea>
                    <small id="value-help" class="help-text">Value can be any text or JSON</small>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="set-flags-input">Flags</label>
                        <input type="number" id="set-flags-input" name="flags"
                               value="0" min="0" aria-describedby="flags-help">
                        <span id="set-flags-error" class="error-message" role="alert" aria-live="polite"></span>
                        <small id="flags-help" class="help-text">Default: 0</small>
                    </div>
                    <div class="form-group">
                        <label for="set-ttl-input">TTL (seconds)</label>
                        <input type="number" id="set-ttl-input" name="ttl"
                               value="0" min="0" aria-describedby="ttl-help">
                        <span id="set-ttl-error" class="error-message" role="alert" aria-live="polite"></span>
                        <small id="ttl-help" class="help-text">0 = no expiry</small>
                    </div>
                </div>
                <button type="submit" id="set-btn">Set</button>
            </form>
        </section>

        <!-- Operations Panel (Scenario 5) -->
        <section id="operations-panel" class="panel" aria-label="Operations">
            <h2>Operations</h2>
            <button id="compact-btn" type="button" aria-label="Trigger major compaction">
                Trigger Major Compaction
            </button>
        </section>
    </main>

    <!-- Toast notifications -->
    <div id="toast-container" role="status" aria-live="polite" aria-atomic="true">
    </div>

    <script src="/app.js"></script>
</body>
</html>
