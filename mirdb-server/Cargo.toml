[package]
name = "mirdb"
version = "0.1.0"
authors = ["yetone <yetoneful@gmail.com>"]
edition = "2018"

[lib]
name = "mirdb"
path = "src/lib.rs"

[[bin]]
name = "mirdb"
path = "src/main.rs"

[dependencies]
skip-list = { path = "../skip-list" }
sstable = { path = "../sstable" }
bytes = "0.4"
futures = "0.1.18"
tokio = "0.1.18"
tokio-io = "0.1.12"
tokio-proto = "0.1"
tokio-service = "0.1"
glob = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.1.2"
integer-encoding = "1.0"
snap = "0.2"
crc = "1.2"
memmap = "0.7.0"
clap = "2.33.0"
toml = "0.5.0"
log = "0.4.0"
env_logger = "0.6.1"

# Web server dependencies
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header"] }
rust-embed = "8.0"
mime_guess = "2.0"
tokio_new = { package = "tokio", version = "1", features = ["full"] }
http = "1.0"
hex = "0.4"

[dev-dependencies]
rand = "0.6.1"
tokio-test = "0.4"
