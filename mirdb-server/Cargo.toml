[package]
name = "mirdb"
version = "0.1.0"
authors = ["yetone <yetoneful@gmail.com>"]
edition = "2021"

[lib]
name = "mirdb"
path = "src/lib.rs"

[[bin]]
name = "mirdb"
path = "src/main.rs"

[dependencies]
skip-list = { path = "../skip-list" }
sstable = { path = "../sstable" }
bytes = "1.5"
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
glob = "0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
integer-encoding = "4.0"
snap = "1.1"
crc = "3.0"
memmap2 = "0.9"
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"

# Web server dependencies
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header"] }
hyper = { version = "1.1", features = ["full"] }
rust-embed = "8.0"
mime_guess = "2.0"
http = "1.0"
hex = "0.4"

[dev-dependencies]
rand = "0.8"
reqwest = { version = "0.11", features = ["json"] }
tokio-test = "0.4"
tempfile = "3.8"
