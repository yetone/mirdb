<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f8cff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Database cylinder -->
  <ellipse cx="32" cy="16" rx="22" ry="8" fill="url(#grad)"/>
  <rect x="10" y="16" width="44" height="32" fill="url(#grad)"/>
  <ellipse cx="32" cy="48" rx="22" ry="8" fill="url(#grad)"/>
  <!-- Middle line -->
  <ellipse cx="32" cy="32" rx="22" ry="8" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5"/>
  <!-- Top highlight -->
  <ellipse cx="32" cy="16" rx="18" ry="5" fill="#fff" opacity="0.3"/>
  <!-- Key icon -->
  <circle cx="32" cy="32" r="6" fill="#fff" opacity="0.9"/>
  <rect x="30" y="32" width="4" height="10" fill="#fff" opacity="0.9"/>
  <rect x="34" y="36" width="4" height="2" fill="#fff" opacity="0.9"/>
  <rect x="34" y="40" width="3" height="2" fill="#fff" opacity="0.9"/>
</svg>
