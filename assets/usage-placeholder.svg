<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Terminal window background -->
  <rect width="640" height="400" rx="8" fill="url(#termBg)"/>
  <!-- Title bar -->
  <rect width="640" height="32" rx="8" fill="#334155"/>
  <rect y="24" width="640" height="8" fill="#334155"/>
  <!-- Window controls -->
  <circle cx="20" cy="16" r="6" fill="#ef4444"/>
  <circle cx="40" cy="16" r="6" fill="#eab308"/>
  <circle cx="60" cy="16" r="6" fill="#22c55e"/>
  <!-- Terminal title -->
  <text x="320" y="20" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Terminal - MirDB Demo</text>
  <!-- Terminal content -->
  <text x="20" y="60" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#94a3b8">$ telnet localhost 12333</text>
  <text x="20" y="85" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#f1f5f9">Trying 127.0.0.1...</text>
  <text x="20" y="110" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#f1f5f9">Connected to localhost.</text>
  <text x="20" y="145" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#22c55e">set mykey 0 0 5</text>
  <text x="20" y="170" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#38bdf8">hello</text>
  <text x="20" y="195" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#a78bfa">STORED</text>
  <text x="20" y="230" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#22c55e">get mykey</text>
  <text x="20" y="255" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#a78bfa">VALUE mykey 0 5</text>
  <text x="20" y="280" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#38bdf8">hello</text>
  <text x="20" y="305" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#a78bfa">END</text>
  <text x="20" y="340" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#22c55e">delete mykey</text>
  <text x="20" y="365" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#a78bfa">DELETED</text>
  <!-- Cursor -->
  <rect x="20" y="375" width="8" height="14" fill="#f1f5f9" opacity="0.8"/>
</svg>
