[package]
name = "sstable"
version = "0.1.0"
authors = ["yetone <yetoneful@gmail.com>"]
edition = "2021"

[lib]
name = "sstable"

[dependencies]
crc = "3.0"
integer-encoding = "4.0"
snap = "1.1"
cuckoofilter = { git = "https://github.com/seiflotfy/rust-cuckoofilter", tag = "v0.4.0" }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
lru = "0.12"
