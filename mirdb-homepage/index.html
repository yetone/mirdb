<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MirDB - A persistent key-value store with memcached protocol compatibility, built with Rust">
  <meta name="keywords" content="MirDB, key-value store, memcached, Rust, LSM Tree, database">
  <title>MirDB - Persistent Key-Value Store</title>
  <link rel="stylesheet" href="/src/styles/globals.css">
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-white">

    <!-- Hero Section -->
    <section id="hero" class="min-h-screen flex items-center justify-center">

    <!-- Features Section -->

    </section>

    <!-- Footer component will be rendered here -->
