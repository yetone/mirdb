<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MirDB - A Persistent Key-Value Store with Memcached protocol compatibility">
  <title>MirDB - Persistent Key-Value Store</title>

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Prism.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
</head>
<body>
  <!-- Header/Navigation - Scenario 6 -->
  <header>
    <nav id="main-nav">
      <!-- Navigation menu - owned by Scenario 6 -->
    </nav>
  </header>

  <main>
    <!-- Hero Section - Scenario 1 -->
    <section id="hero">
      <!-- Hero content - owned by Scenario 1 -->
    </section>

    <!-- Features Section - Scenario 2 -->
    <section id="features">
      <!-- Feature cards - owned by Scenario 2 -->
    </section>

    <!-- Quick Start Section - Scenario 3 -->
    <section id="quick-start">
      <div class="container">
        <h2 class="quickstart-title">Quick Start</h2>
        <p class="quickstart-description">
          Get started with MirDB in seconds. Clone the repository and run the server.
        </p>

        <div class="code-block-wrapper">
          <div class="code-block">
            <button
              type="button"
              class="copy-button"
              data-copy-target="#install-command"
              aria-label="Copy installation command to clipboard"
            >
              Copy
            </button>
            <pre><code id="install-command" class="language-bash">git clone https://github.com/yetone/mirdb.git &amp;&amp; cd mirdb &amp;&amp; cargo run</code></pre>
          </div>
        </div>

        <p class="quickstart-docs-link">
          <a href="https://github.com/yetone/mirdb#readme" target="_blank" rel="noopener noreferrer">
            Read the full documentation
            <svg class="external-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </p>
      </div>
    </section>

    <!-- Usage Section - Scenario 4 -->
    <section id="usage">
      <!-- Usage examples - owned by Scenario 4 -->
    </section>

    <!-- Status Section - Scenario 5 -->
    <section id="status">
      <!-- Status badges - owned by Scenario 5 -->
    </section>
  </main>

  <!-- Footer - Scenario 11 -->
  <footer>
    <!-- Footer content - owned by Scenario 11 -->
  </footer>

  <!-- Prism.js for syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>

  <!-- Main JavaScript -->
  <script src="js/main.js"></script>
</body>
</html>
