<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">MirDB LSM-Tree Architecture Diagram</title>
  <desc id="arch-desc">Data flow diagram showing Client to Memcached Protocol to Memtable to SSTable to Storage. Illustrates the Log-Structured Merge-tree architecture with write-ahead log, minor compaction, and major compaction processes.</desc>

  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>

  <!-- Definitions -->
  <defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>

    <!-- Gradient for boxes -->
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Client Box -->
  <g transform="translate(50, 200)">
    <rect width="100" height="60" rx="8" fill="url(#boxGradient)" filter="url(#shadow)"/>
    <text x="50" y="35" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Client</text>
  </g>

  <!-- Arrow: Client to Protocol -->
  <line x1="150" y1="230" x2="175" y2="230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Memcached Protocol Box -->
  <g transform="translate(185, 185)">
    <rect width="120" height="90" rx="8" fill="url(#greenGradient)" filter="url(#shadow)"/>
    <text x="60" y="35" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Memcached</text>
    <text x="60" y="55" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Protocol</text>
    <text x="60" y="75" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">set | get | delete</text>
  </g>

  <!-- Arrow: Protocol to WAL -->
  <line x1="305" y1="210" x2="340" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- WAL Box (Write-Ahead Log) -->
  <g transform="translate(350, 80)">
    <rect width="100" height="60" rx="8" fill="url(#orangeGradient)" filter="url(#shadow)"/>
    <text x="50" y="28" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">WAL</text>
    <text x="50" y="45" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Write-Ahead Log</text>
  </g>

  <!-- Arrow: Protocol to Memtable -->
  <line x1="305" y1="230" x2="340" y2="230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Memtable Box -->
  <g transform="translate(350, 185)">
    <rect width="100" height="90" rx="8" fill="url(#purpleGradient)" filter="url(#shadow)"/>
    <text x="50" y="30" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Memtable</text>
    <text x="50" y="50" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">In-Memory</text>
    <text x="50" y="65" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Skip List</text>
    <text x="50" y="80" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">(sorted keys)</text>
  </g>

  <!-- Minor Compaction Label -->
  <text x="470" y="185" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Minor</text>
  <text x="470" y="197" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Compaction</text>

  <!-- Arrow: Memtable to SSTable -->
  <line x1="450" y1="230" x2="515" y2="230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- SSTable Box -->
  <g transform="translate(525, 170)">
    <rect width="110" height="120" rx="8" fill="url(#boxGradient)" filter="url(#shadow)"/>
    <text x="55" y="28" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">SSTable</text>
    <text x="55" y="45" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sorted String Table</text>
    <!-- Level indicators -->
    <rect x="15" y="55" width="80" height="16" rx="3" fill="rgba(255,255,255,0.2)"/>
    <text x="55" y="67" fill="white" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Level 0</text>
    <rect x="15" y="75" width="80" height="16" rx="3" fill="rgba(255,255,255,0.15)"/>
    <text x="55" y="87" fill="white" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Level 1</text>
    <rect x="15" y="95" width="80" height="16" rx="3" fill="rgba(255,255,255,0.1)"/>
    <text x="55" y="107" fill="white" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Level N...</text>
  </g>

  <!-- Major Compaction Label -->
  <text x="650" y="185" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Major</text>
  <text x="650" y="197" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-style="italic">Compaction</text>

  <!-- Arrow: SSTable to Storage -->
  <line x1="635" y1="230" x2="680" y2="230" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Storage Box -->
  <g transform="translate(690, 185)">
    <rect width="90" height="90" rx="8" fill="url(#greenGradient)" filter="url(#shadow)"/>
    <text x="45" y="35" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Storage</text>
    <text x="45" y="55" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Persistent</text>
    <text x="45" y="70" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Disk Files</text>
  </g>

  <!-- Dashed line from WAL to Storage (durability) -->
  <path d="M 450 110 C 550 80, 650 80, 735 185" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,5" fill="none"/>
  <text x="545" y="70" fill="#f97316" font-family="system-ui, sans-serif" font-size="9" font-style="italic">Durability</text>

  <!-- Legend -->
  <g transform="translate(50, 380)">
    <text x="0" y="0" fill="#374151" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Data Flow Legend:</text>

    <!-- Write Path -->
    <rect x="0" y="15" width="12" height="12" rx="2" fill="url(#boxGradient)"/>
    <text x="20" y="25" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Write/Read Components</text>

    <!-- In-Memory -->
    <rect x="160" y="15" width="12" height="12" rx="2" fill="url(#purpleGradient)"/>
    <text x="180" y="25" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">In-Memory Layer</text>

    <!-- Protocol/Storage -->
    <rect x="300" y="15" width="12" height="12" rx="2" fill="url(#greenGradient)"/>
    <text x="320" y="25" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Protocol/Storage Layer</text>

    <!-- WAL -->
    <rect x="460" y="15" width="12" height="12" rx="2" fill="url(#orangeGradient)"/>
    <text x="480" y="25" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10">Write-Ahead Log</text>
  </g>

  <!-- Read Path Indicator -->
  <g transform="translate(50, 440)">
    <text x="0" y="0" fill="#374151" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Read Path: Memtable (newest) → Immutable Memtables → Level 0 → Level 1+</text>
  </g>
</svg>
