<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Database cylinder shape -->
  <ellipse cx="60" cy="35" rx="45" ry="15" fill="url(#grad)" />
  <rect x="15" y="35" width="90" height="50" fill="url(#grad)" />
  <ellipse cx="60" cy="85" rx="45" ry="15" fill="url(#grad)" />
  <!-- Highlight lines -->
  <ellipse cx="60" cy="35" rx="45" ry="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3" />
  <ellipse cx="60" cy="55" rx="45" ry="15" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />
  <ellipse cx="60" cy="70" rx="45" ry="15" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2" />
  <!-- Key icon overlay -->
  <circle cx="60" cy="60" r="12" fill="#ffffff" opacity="0.9" />
  <circle cx="60" cy="60" r="6" fill="url(#grad)" />
</svg>
