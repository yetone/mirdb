<div id="quickstart-section">
  <h2>Quick Start</h2>
  <div class="command-group">
    <h3>Connect to MirDB</h3>
    <div class="command">
      <pre><code>$ telnet localhost 12333</code></pre>
      <button class="copy-btn" data-command="telnet localhost 12333">Copy</button>
    </div>
  </div>
  <div class="command-group">
    <h3>Basic Commands</h3>
    <div class="command">
      <pre><code>> set mykey 0 0 5</code></pre>
      <button class="copy-btn" data-command="set mykey 0 0 5">Copy</button>
    </div>
    <div class="command">
      <pre><code>> hello</code></pre>
      <button class="copy-btn" data-command="hello">Copy</button>
    </div>
    <div class="command">
      <pre><code>STORED</code></pre>
    </div>
    <div class="command">
      <pre><code>> get mykey</code></pre>
      <button class="copy-btn" data-command="get mykey">Copy</button>
    </div>
    <div class="command">
      <pre><code>VALUE mykey 0 5</code></pre>
    </div>
    <div class="command">
      <pre><code>hello</code></pre>
    </div>
    <div class="command">
      <pre><code>END</code></pre>
    </div>
  </div>
</div>
