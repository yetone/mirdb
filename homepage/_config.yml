# Jekyll Configuration for MirDB Homepage
title: MirDB
description: A persistent key-value store with Memcached protocol compatibility
baseurl: ""
url: ""

# Build settings
markdown: kramdown
sass:
  style: compressed
  sass_dir: _sass

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - tests
  - README.md

# Social/Open Graph
social:
  name: MirDB
  links:
    - https://github.com/mirdb/mirdb
