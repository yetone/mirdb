  - License information

<footer role="contentinfo" class="footer" aria-label="Site footer">
    <div class="footer__content">
        <nav class="footer__links" aria-label="Footer links">
            <a href="{{ config.extra.github_repo }}"
               class="footer__link"
               target="_blank"
               rel="noopener noreferrer"

            <a href="{{ config.extra.github_repo }}/blob/master/LICENSE"

               rel="noopener noreferrer"

            <a href="{{ config.extra.github_repo }}/issues"
               class="footer__link"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Report issues on GitHub (opens in new tab)">
                Issues
            </a>
        </nav>
        <p class="footer__copyright">
            MirDB - A Persistent Key-Value Store with Memcached Protocol
        </p>
