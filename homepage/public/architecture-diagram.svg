<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">MirDB Data Flow Architecture Diagram</title>
  <desc id="diagram-desc">A visual representation of MirDB's LSM-tree data flow: Client sends requests through the Memcached Protocol Parser, which writes to the active Memtable. When full, the Memtable becomes an Immutable Memtable, which is then flushed to SSTable Level 0 through minor compaction. Major compaction merges SSTables into higher levels.</desc>

  <defs>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="parserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="memtableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="immutableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sstableGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="transparent"/>

  <!-- Client Box -->
  <g class="client-group">
    <rect x="140" y="20" width="120" height="50" rx="8" fill="url(#clientGrad)" />
    <text x="200" y="50" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Client</text>
  </g>

  <!-- Arrow: Client to Protocol Parser -->
  <line x1="200" y1="70" x2="200" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Protocol Parser Box -->
  <g class="parser-group">
    <rect x="110" y="110" width="180" height="50" rx="8" fill="url(#parserGrad)" />
    <text x="200" y="135" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Memcached Protocol</text>
    <text x="200" y="150" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Parser</text>
  </g>

  <!-- Arrow: Protocol Parser to Memtable -->
  <line x1="200" y1="160" x2="200" y2="190" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Memtable Box -->
  <g class="memtable-group">
    <rect x="110" y="200" width="180" height="50" rx="8" fill="url(#memtableGrad)" />
    <text x="200" y="225" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Memtable</text>
    <text x="200" y="240" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" opacity="0.9">(Active Skip List)</text>
  </g>

  <!-- Label: when full -->
  <text x="310" y="275" text-anchor="start" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-style="italic">when full</text>

  <!-- Arrow: Memtable to Immutable Memtable -->
  <line x1="200" y1="250" x2="200" y2="280" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- Immutable Memtable Box -->
  <g class="immutable-group">
    <rect x="110" y="290" width="180" height="50" rx="8" fill="url(#immutableGrad)" />
    <text x="200" y="315" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Immutable Memtable</text>
    <text x="200" y="330" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="10" opacity="0.9">(Queue)</text>
  </g>

  <!-- Label: minor compaction -->
  <text x="310" y="365" text-anchor="start" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-style="italic">minor compaction</text>

  <!-- Arrow: Immutable Memtable to SSTable Level 0 -->
  <line x1="200" y1="340" x2="200" y2="370" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- SSTable Level 0 Box -->
  <g class="sstable-l0-group">
    <rect x="110" y="380" width="180" height="45" rx="8" fill="url(#sstableGrad)" />
    <text x="200" y="405" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SSTable Level 0</text>
    <text x="200" y="418" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="9" opacity="0.9">(May overlap)</text>
  </g>

  <!-- Label: major compaction -->
  <text x="310" y="448" text-anchor="start" fill="#6b7280" font-family="system-ui, sans-serif" font-size="10" font-style="italic">major compaction</text>

  <!-- Arrow: SSTable Level 0 to SSTable Level 1+ -->
  <line x1="200" y1="425" x2="200" y2="450" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)" />

  <!-- SSTable Level 1+ Box -->
  <g class="sstable-l1-group">
    <rect x="110" y="458" width="180" height="35" rx="8" fill="url(#sstableGrad)" opacity="0.8" />
    <text x="200" y="480" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">SSTable Level 1+</text>
  </g>
</svg>
