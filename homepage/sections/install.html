<!--
  Owner: Scenario 3 - Installation Instructions.
  Required:
    <section id="install"> containing:
      - <pre><code> with "cargo install ..." command, data-copy attribute
      - <pre><code> with pre-built binary instructions, data-copy attribute
      - <button class="copy-btn"> for each code block (handled by js/copy.js)
-->
<section id="install">
  <div class="container">
    <h2>Installation</h2>
    <p>Get MirDB up and running in seconds.</p>

    <div class="install-method">
      <h3>Via Cargo</h3>
      <div class="code-block">
        <pre><code data-copy>cargo install mirdb</code></pre>
        <button class="copy-btn" aria-label="Copy cargo install command">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
    </div>

    <div class="install-method">
      <h3>Pre-built Binary</h3>
      <div class="code-block">
        <pre><code data-copy>curl -sSL https://github.com/yetone/mirdb/releases/latest/download/mirdb-linux-x64.tar.gz | tar xz
./mirdb</code></pre>
        <button class="copy-btn" aria-label="Copy binary download command">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
      <p class="install-note">Or download the latest release from the <a href="https://github.com/yetone/mirdb/releases" target="_blank" rel="noopener noreferrer">GitHub releases page</a>.</p>
    </div>
  </div>
</section>
