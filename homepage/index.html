<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MirDB - A persistent key-value store implementing the Memcached protocol. Built with Rust and featuring LSM-tree storage engine.">
  <meta name="keywords" content="MirDB, key-value store, Memcached, Rust, database, persistent storage">
  <title>MirDB - Persistent Key-Value Store</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon placeholder -->
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body>
  <!--
    MirDB Homepage

    Main HTML document containing all page sections.
    Structure:
    - Header with navigation (Scenario 5)
    - Hero section with logo and tagline (Scenario 1)
    - Features section with feature cards (Scenario 2)
    - Technology stack section (Scenario 3)
    - Quick Start section with code examples (Scenario 4)
    - Resources section with links and badges (Scenario 5)
    - Footer (Scenario 5)

    WCAG 2.1 AA compliance required (Scenario 7)
  -->

  <!-- ====================
       HEADER / NAV (Scenario 5)
       ==================== -->
  <header class="header" role="banner">
    <!-- Navigation to be implemented by Scenario 5 -->
  </header>

  <main role="main">
    <!-- ====================
         HERO SECTION (Scenario 1)
         ==================== -->
    <section id="hero" class="hero" aria-labelledby="hero-title">
      <div class="hero__content">
        <!-- Logo -->
        <div class="hero__logo">
          <img src="assets/images/logo.svg" alt="MirDB logo" width="200" height="60">
        </div>

        <!-- Title -->
        <h1 id="hero-title" class="hero__title">MirDB</h1>

        <!-- Tagline / Product Description -->
        <p class="hero__tagline">
          A Persistent Key-Value Store implementing the Memcached protocol.
          Built with Rust and powered by an LSM-tree storage engine.
        </p>

        <!-- Primary CTA -->
        <a href="#quick-start" class="hero__cta" role="button">
          Get Started
          <svg class="hero__cta-icon" aria-hidden="true" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
          </svg>
        </a>
      </div>
    </section>

    <!-- ====================
         FEATURES SECTION (Scenario 2)
         ==================== -->
    <section id="features" class="features" aria-labelledby="features-title">
      <div class="container">
        <h2 id="features-title" class="sr-only">Features</h2>
        <!-- Features content to be implemented by Scenario 2 -->
      </div>
    </section>

    <!-- ====================
         TECHNOLOGY STACK SECTION (Scenario 3)
         ==================== -->
    <section id="tech-stack" class="tech-stack" aria-labelledby="tech-title">
      <div class="container">
        <h2 id="tech-title" class="sr-only">Technology Stack</h2>
        <!-- Tech stack content to be implemented by Scenario 3 -->
      </div>
    </section>

    <!-- ====================
         QUICK START SECTION (Scenario 4)
         ==================== -->
    <section id="quick-start" class="quick-start" aria-labelledby="quickstart-title">
      <div class="container">
        <h2 id="quickstart-title" class="sr-only">Quick Start</h2>
        <!-- Quick start content to be implemented by Scenario 4 -->
      </div>
    </section>

    <!-- ====================
         RESOURCES SECTION (Scenario 5)
         ==================== -->
    <section id="resources" class="resources" aria-labelledby="resources-title">
      <div class="container">
        <h2 id="resources-title" class="sr-only">Resources</h2>
        <!-- Resources content to be implemented by Scenario 5 -->
      </div>
    </section>
  </main>

  <!-- ====================
       FOOTER (Scenario 5)
       ==================== -->
  <footer class="footer" role="contentinfo">
    <!-- Footer content to be implemented by Scenario 5 -->
  </footer>

  <!-- JavaScript -->
  <script src="js/main.js" defer></script>
</body>
</html>
