<!--
  MirDB Product Homepage
  A static single-page website showcasing MirDB's capabilities

  Structure:
  - Header with logo, tagline, navigation
  - Hero section with value proposition and CTA
  - Features section with capability cards
  - Architecture section with diagram
  - Usage section with code examples
  - Status section with feature checklist
  - Getting Started section with installation
  - Footer with links

  Theme: Supports dark/light mode via prefers-color-scheme
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MirDB - Persistent Key-Value Store with Memcached Protocol</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body>
  <!-- Header Section - Owner: Scenario 1 -->
  <header id="header">
    <!-- Header content will be added by Scenario 1 -->
  </header>

  <main>
    <!-- Hero Section - Owner: Scenario 2 -->
    <section id="hero" class="hero">
      <div class="hero__container">
        <h1 class="hero__title">MirDB: A Persistent Key-Value Store with Memcached Protocol</h1>
        <p class="hero__subtitle">Drop-in replacement for memcached with persistent storage. Built with Rust for memory safety and high performance.</p>

        <div class="hero__badges">
          <a href="https://circleci.com/gh/yetone/mirdb" target="_blank" rel="noopener noreferrer" class="hero__badge-link">
            <img src="https://circleci.com/gh/yetone/mirdb.svg?style=svg" alt="CircleCI Build Status" class="hero__badge">
          </a>
        </div>

        <div class="hero__cta-container">
          <a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener noreferrer" class="hero__cta hero__cta--primary">View on GitHub</a>
          <a href="#getting-started" class="hero__cta hero__cta--secondary">Get Started</a>
        </div>
      </div>
    </section>

    <!-- Features Section - Owner: Scenario 3 -->
    <section id="features">
      <!-- Features content will be added by Scenario 3 -->
    </section>

    <!-- Architecture Section - Owner: Scenario 4 -->
    <section id="architecture">
      <!-- Architecture content will be added by Scenario 4 -->
    </section>

    <!-- Usage Section - Owner: Scenario 5 -->
    <section id="usage">
      <!-- Usage content will be added by Scenario 5 -->
    </section>

    <!-- Status Section - Owner: Scenario 6 -->
    <section id="status">
      <!-- Status content will be added by Scenario 6 -->
    </section>

    <!-- Getting Started Section - Owner: Scenario 13 -->
    <section id="getting-started">
      <!-- Getting started content will be added by Scenario 13 -->
    </section>
  </main>

  <!-- Footer Section - Owner: Scenario 7 -->
  <footer id="footer">
    <!-- Footer content will be added by Scenario 7 -->
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
