<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MirDB - A persistent key-value store with Memcached protocol support, written in Rust">
    <title>MirDB - Persistent Key-Value Store</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="/" class="nav-logo" aria-label="MirDB Home">MirDB</a>
            <ul class="nav-links">
                <li><a href="#features">Features</a></li>
                <li><a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener">Documentation</a></li>
                <li><a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener">GitHub</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" id="hero" data-testid="hero-section">
            <div class="hero-content">
                <div class="hero-logo" data-testid="hero-logo">
                    <img src="../assets/logo.gif" alt="MirDB Logo" class="logo-image" data-testid="mirdb-logo">
                    <h1 class="hero-title" data-testid="product-name">MirDB</h1>
                </div>
                <p class="hero-tagline" data-testid="hero-tagline">
                    A Persistent Key-Value Store with Memcached protocol support, written in Rust
                </p>
                <div class="hero-cta" data-testid="hero-cta">
                    <a href="https://github.com/yetone/mirdb#readme" class="btn btn-primary" data-testid="cta-get-started">
                        Get Started
                    </a>
                    <a href="https://github.com/yetone/mirdb" class="btn btn-secondary" data-testid="cta-documentation">
                        Documentation
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 MirDB. Licensed under MIT.</p>
    </footer>
</body>
</html>
