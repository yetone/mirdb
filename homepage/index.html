<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>ProductName - Intelligent Workflow Automation Platform</title>
    <meta name="title" content="ProductName - Intelligent Workflow Automation Platform" />
    <meta name="description" content="Transform your team's workflow with AI-powered automation. Streamline collaboration, automate repetitive tasks, and boost productivity." />
    <meta name="keywords" content="workflow automation, productivity, team collaboration, AI tools, task automation" />
    <meta name="author" content="ProductName" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://productname.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.ico" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://productname.com/" />
    <meta property="og:title" content="ProductName - Intelligent Workflow Automation Platform" />
    <meta property="og:description" content="Transform your team's workflow with AI-powered automation. Streamline collaboration and boost productivity." />
    <meta property="og:image" content="https://productname.com/og-image.png" />
    <meta property="og:image:alt" content="ProductName - Workflow Automation" />
    <meta property="og:site_name" content="ProductName" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://productname.com/" />
    <meta name="twitter:title" content="ProductName - Intelligent Workflow Automation Platform" />
    <meta name="twitter:description" content="Transform your team's workflow with AI-powered automation. Streamline collaboration and boost productivity." />
    <meta name="twitter:image" content="https://productname.com/og-image.png" />

    <!-- Theme Color for mobile browsers -->
    <meta name="theme-color" content="#3b82f6" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
