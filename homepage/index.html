<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MirDB - A persistent key-value store with Memcached protocol support. Drop-in replacement for Memcached with disk persistence.">
  <title>MirDB - Persistent Key-Value Store with Memcached Protocol</title>

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/hero.css">
  <link rel="stylesheet" href="assets/css/features.css">
  <link rel="stylesheet" href="assets/css/demo.css">
  <link rel="stylesheet" href="assets/css/quickstart.css">

  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <!-- Skip Link for Accessibility (Scenario 11) -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header/Navigation (Scenario 7) -->
  <header id="header" role="banner">
    <!-- Navigation will be implemented by Scenario 7 -->
  </header>

  <main id="main-content" role="main">
    <!-- Hero Section (Scenario 1) -->
    <section id="hero" class="hero" aria-labelledby="hero-headline">
      <div class="hero__content">
        <div class="hero__logo" aria-hidden="true">
          <!-- Logo SVG placeholder -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="8" fill="url(#logo-gradient)"/>
            <path d="M14 34V14h4l6 12 6-12h4v20h-4V22l-4.5 9h-3L18 22v12h-4z" fill="white"/>
            <defs>
              <linearGradient id="logo-gradient" x1="0" y1="0" x2="48" y2="48">
                <stop offset="0%" stop-color="#6366f1"/>
                <stop offset="100%" stop-color="#4f46e5"/>
              </linearGradient>
            </defs>
          </svg>
        </div>

        <h1 id="hero-headline" class="hero__headline">
          <span class="hero__headline-highlight">MirDB</span>: Persistent Key-Value Store
        </h1>

        <p class="hero__description">
          A Memcached-compatible protocol with persistent disk storage.
          Drop-in replacement that persists your data using LSM tree architecture.
        </p>

        <div class="hero__cta">
          <a href="#demo" class="hero__btn hero__btn--primary" data-testid="cta-try-demo">
            Try Demo
          </a>
          <a href="#quickstart" class="hero__btn hero__btn--secondary" data-testid="cta-get-started">
            Get Started
          </a>
        </div>
      </div>
    </section>

    <!-- Features Section (Scenario 2) -->
    <section id="features" class="features" aria-labelledby="features-headline">
      <!-- Features will be implemented by Scenario 2 -->
    </section>

    <!-- Interactive Demo Section (Scenario 3) -->
    <section id="demo" class="demo" aria-labelledby="demo-headline">
      <!-- Demo will be implemented by Scenario 3 -->
    </section>

    <!-- Code Examples Section (Scenario 4) -->
    <section id="examples" class="examples" aria-labelledby="examples-headline">

    </section>

    <!-- Quick Start Section (Scenario 5) -->
    <section id="quickstart" class="quickstart" aria-labelledby="quickstart-headline">
      <!-- Quick start will be implemented by Scenario 5 -->
    </section>

    <!-- Project Status Section (Scenario 6) -->
    <section id="status" class="status" aria-labelledby="status-headline">
      <!-- Status will be implemented by Scenario 6 -->
    </section>
  </main>

  <!-- Footer (Scenario 7) -->

    <!-- Footer will be implemented by Scenario 7 -->
