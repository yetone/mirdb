[package]
name = "mirdb-demo-backend"
version = "0.1.0"
edition = "2021"
description = "Demo backend service for MirDB homepage interactive demo"

[dependencies]
actix-web = "4.4"
actix-cors = "0.7"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"

[dev-dependencies]
actix-rt = "2.9"

[[bin]]
name = "demo-server"
path = "src/main.rs"
