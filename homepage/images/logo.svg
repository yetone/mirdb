<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#logoGradient)" />

  <!-- Database icon representation -->
  <g fill="#ffffff">
    <!-- Top ellipse (database top) -->
    <ellipse cx="60" cy="35" rx="28" ry="10" />

    <!-- Database body -->
    <rect x="32" y="35" width="56" height="40" />

    <!-- Middle line -->
    <ellipse cx="60" cy="55" rx="28" ry="10" fill-opacity="0.3" />

    <!-- Bottom ellipse (database bottom) -->
    <ellipse cx="60" cy="75" rx="28" ry="10" />
  </g>

  <!-- "M" letter stylized -->
  <text x="60" y="68"
        font-family="system-ui, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#3b82f6"
        text-anchor="middle"
        dominant-baseline="middle">M</text>
</svg>
