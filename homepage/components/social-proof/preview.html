<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Social Proof Section &mdash; Scenario 9 Preview</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="components/social-proof/social-proof.css">
    <style>
        body {
            background: var(--color-bg, #ffffff);
            color: var(--color-text, #1a1a1a);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: 2rem 0 0 0;
        }
        :root[data-theme="dark"] body {
            background: #111114;
            color: #f5f5f7;
        }
        .demo-toolbar {
            position: sticky;
            top: 0;
            background: var(--color-surface, #f5f5f7);
            color: var(--color-text, #1a1a1a);
            border-bottom: 1px solid var(--color-border, #e2e2e8);
            padding: 0.85rem 1.5rem;
            display: flex;
            gap: 0.75rem;
            align-items: center;
            z-index: 10;
        }
        :root[data-theme="dark"] .demo-toolbar {
            background: #1f1f23;
            color: #f5f5f7;
            border-bottom-color: #2a2a30;
        }
        .demo-toolbar strong {
            margin-right: auto;
            font-size: 1rem;
        }
        .demo-toolbar button {
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .demo-toolbar button:hover { background: #1d4ed8; }
        .demo-toolbar button[data-active="true"] {
            background: #1e3a8a;
            box-shadow: inset 0 0 0 2px #93c5fd;
        }
    </style>
</head>
<body>
    <div class="demo-toolbar">
        <strong>Social Proof Section &mdash; Scenario 9</strong>
        <button id="btn-populated" data-active="true">Populated</button>
        <button id="btn-empty">Empty data</button>
        <button id="btn-theme">Toggle theme</button>
    </div>
    <section class="social-proof" aria-labelledby="social-proof-heading" hidden>
        <div class="container">
            <h2 id="social-proof-heading" class="social-proof__heading">Trusted by teams worldwide</h2>
            <p class="social-proof__user-count" data-empty="true"></p>
            <ul class="social-proof__testimonials" role="list"></ul>
            <ul class="social-proof__badges" role="list" aria-label="Trust badges"></ul>
        </div>
    </section>
    <p id="empty-marker" style="text-align:center;padding:3rem;font-style:italic;color:#888;display:none;">
        (Section is hidden when no data is supplied &mdash; nothing renders here.)
    </p>

    <script type="module">
        import { renderSocialProof } from "/components/social-proof/social-proof.js";
        import { SOCIAL_PROOF_DATA, EMPTY_SOCIAL_PROOF_DATA } from "/components/social-proof/social-proof.data.js";

        const section = document.querySelector("section.social-proof");
        const marker = document.getElementById("empty-marker");
        const btnPopulated = document.getElementById("btn-populated");
        const btnEmpty = document.getElementById("btn-empty");
        const btnTheme = document.getElementById("btn-theme");

        function render(mode) {
            if (mode === "empty") {
                renderSocialProof(section, EMPTY_SOCIAL_PROOF_DATA);
                marker.style.display = "block";
                btnPopulated.dataset.active = "false";
                btnEmpty.dataset.active = "true";
            } else {
                renderSocialProof(section, SOCIAL_PROOF_DATA);
                marker.style.display = "none";
                btnPopulated.dataset.active = "true";
                btnEmpty.dataset.active = "false";
            }
        }

        btnPopulated.addEventListener("click", () => render("populated"));
        btnEmpty.addEventListener("click", () => render("empty"));
        btnTheme.addEventListener("click", () => {
            const root = document.documentElement;
            const current = root.getAttribute("data-theme") || "light";
            root.setAttribute("data-theme", current === "light" ? "dark" : "light");
        });

        render("populated");
    </script>
</body>
</html>
