<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Database icon -->
  <g transform="translate(5, 5)">
    <!-- Top ellipse -->
    <ellipse cx="25" cy="10" rx="20" ry="8" fill="url(#logoGradient)" />
    <!-- Middle body -->
    <rect x="5" y="10" width="40" height="30" fill="url(#logoGradient)" />
    <!-- Bottom ellipse -->
    <ellipse cx="25" cy="40" rx="20" ry="8" fill="url(#logoGradient)" />
    <!-- Middle lines -->
    <ellipse cx="25" cy="20" rx="20" ry="8" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5" />
    <ellipse cx="25" cy="30" rx="20" ry="8" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.5" />
  </g>
  <!-- MirDB text -->
  <text x="60" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="currentColor">
    <tspan fill="url(#logoGradient)">Mir</tspan><tspan fill="currentColor">DB</tspan>
  </text>
</svg>
