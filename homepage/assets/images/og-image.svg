<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGradient)"/>

  <!-- Logo/Brand mark -->
  <g transform="translate(100, 180)">
    <!-- Database icon stylized -->
    <rect x="0" y="0" width="80" height="80" rx="12" fill="#e94560"/>
    <rect x="15" y="20" width="50" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="15" y="35" width="50" height="8" rx="2" fill="#1a1a2e"/>
    <rect x="15" y="50" width="35" height="8" rx="2" fill="#1a1a2e"/>
  </g>

  <!-- Title -->
  <text x="200" y="235" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="700" fill="#ffffff">MirDB</text>

  <!-- Tagline -->
  <text x="100" y="330" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" fill="#8b8b9a">A Persistent Key-Value Store</text>
  <text x="100" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" fill="#8b8b9a">with Memcached Protocol</text>

  <!-- Features badges -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="160" height="40" rx="8" fill="#2d2d44"/>
    <text x="80" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e94560">Memcached</text>
  </g>
  <g transform="translate(180, 450)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#2d2d44"/>
    <text x="70" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e94560">Persistent</text>
  </g>
  <g transform="translate(340, 450)">
    <rect x="0" y="0" width="120" height="40" rx="8" fill="#2d2d44"/>
    <text x="60" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e94560">LSM Tree</text>
  </g>
  <g transform="translate(480, 450)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="#2d2d44"/>
    <text x="50" y="27" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#e94560">Rust</text>
  </g>

  <!-- Decorative elements -->
  <circle cx="1050" cy="200" r="120" fill="none" stroke="#e94560" stroke-width="2" opacity="0.3"/>
  <circle cx="1050" cy="200" r="80" fill="none" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <circle cx="1050" cy="200" r="40" fill="#e94560" opacity="0.2"/>

  <!-- Code snippet decoration -->
  <g transform="translate(850, 350)">
    <rect x="0" y="0" width="280" height="180" rx="8" fill="#1a1a2e" stroke="#2d2d44" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="30" rx="8" fill="#2d2d44"/>
    <circle cx="20" cy="15" r="5" fill="#ff6b6b"/>
    <circle cx="38" cy="15" r="5" fill="#ffd93d"/>
    <circle cx="56" cy="15" r="5" fill="#6bff6b"/>

    <text x="20" y="60" font-family="monospace" font-size="14" fill="#6b7280">// Set a value</text>
    <text x="20" y="85" font-family="monospace" font-size="14" fill="#e94560">set</text>
    <text x="50" y="85" font-family="monospace" font-size="14" fill="#ffffff"> mykey 0 0 5</text>
    <text x="20" y="120" font-family="monospace" font-size="14" fill="#6b7280">// Get the value</text>
    <text x="20" y="145" font-family="monospace" font-size="14" fill="#e94560">get</text>
    <text x="50" y="145" font-family="monospace" font-size="14" fill="#ffffff"> mykey</text>
  </g>
</svg>
