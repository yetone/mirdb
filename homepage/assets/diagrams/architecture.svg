<!--
  LSM Tree Architecture Diagram
  Owner: Scenario 4 - Architecture Diagram

  Visual representation of MirDB's data flow:
  - Write path: Client → Memtable → Immutable Memtable → SSTable
  - Read path: Client → Memtable → SSTables (level by level)
  - Compaction: Minor and Major compaction flows

  Requirements:
  - Inline SVG for optimal performance
  - Accessible (aria-label, role="img")
  - Supports dark/light theme via CSS variables
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" class="architecture-diagram" role="img" aria-label="LSM Tree Architecture: Shows write path from Client through Memtable and WAL to SSTables, read path from Client through Memtable and SSTables, and background compaction process">
  <title>MirDB LSM Tree Architecture Diagram</title>
  <desc>A visual diagram showing the LSM tree data flow in MirDB. Write operations go from Client to Memtable with WAL logging, then to SSTables. Read operations check Memtable first, then search through SSTable levels. Background compaction merges SSTables across levels.</desc>

  <style>
    .diagram-bg { fill: var(--color-diagram-bg, #f8f9fa); }
    .box-fill { fill: var(--color-bg, #ffffff); }
    .box-stroke { stroke: var(--color-border, #e0e0e0); stroke-width: 2; }
    .box-primary { fill: var(--color-primary-light, #e3f2fd); stroke: var(--color-primary, #0066cc); stroke-width: 2; }
    .box-memtable { fill: var(--color-memtable-bg, #e8f5e9); stroke: var(--color-memtable-stroke, #4caf50); stroke-width: 2; }
    .box-sstable { fill: var(--color-sstable-bg, #fff3e0); stroke: var(--color-sstable-stroke, #ff9800); stroke-width: 2; }
    .box-wal { fill: var(--color-wal-bg, #fce4ec); stroke: var(--color-wal-stroke, #e91e63); stroke-width: 2; }
    .text-primary { fill: var(--color-text, #1a1a2e); font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); }
    .text-secondary { fill: var(--color-text-secondary, #4a4a68); font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif); }
    .text-label { font-size: 14px; font-weight: 600; }
    .text-small { font-size: 12px; }
    .text-title { font-size: 16px; font-weight: 700; }
    .arrow { fill: none; stroke: var(--color-arrow, #0066cc); stroke-width: 2; marker-end: url(#arrowhead); }
    .arrow-read { stroke: var(--color-arrow-read, #4caf50); }
    .arrow-compact { stroke: var(--color-arrow-compact, #9c27b0); stroke-dasharray: 5,5; }
    .arrow-wal { stroke: var(--color-wal-stroke, #e91e63); }
  </style>

  <defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-arrow, #0066cc)" />
    </marker>
    <marker id="arrowhead-read" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-arrow-read, #4caf50)" />
    </marker>
    <marker id="arrowhead-compact" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-arrow-compact, #9c27b0)" />
    </marker>
    <marker id="arrowhead-wal" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--color-wal-stroke, #e91e63)" />
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="500" class="diagram-bg" rx="8" />

  <!-- Section Labels -->
  <text x="400" y="30" class="text-primary text-title" text-anchor="middle">LSM Tree Architecture</text>

  <!-- Legend -->
  <g transform="translate(600, 45)">
    <text x="0" y="0" class="text-secondary text-small">Legend:</text>
    <line x1="0" y1="15" x2="30" y2="15" class="arrow" style="marker-end: url(#arrowhead);" />
    <text x="35" y="19" class="text-secondary text-small">Write Path</text>
    <line x1="0" y1="35" x2="30" y2="35" class="arrow arrow-read" style="marker-end: url(#arrowhead-read);" />
    <text x="35" y="39" class="text-secondary text-small">Read Path</text>
    <line x1="0" y1="55" x2="30" y2="55" class="arrow arrow-compact" style="marker-end: url(#arrowhead-compact);" />
    <text x="35" y="59" class="text-secondary text-small">Compaction</text>
  </g>

  <!-- Client Box -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="100" height="60" rx="8" class="box-primary" />
    <text x="50" y="35" class="text-primary text-label" text-anchor="middle">Client</text>
  </g>

  <!-- WAL Box -->
  <g transform="translate(200, 100)">
    <rect x="0" y="0" width="100" height="50" rx="8" class="box-wal" />
    <text x="50" y="20" class="text-primary text-label" text-anchor="middle">WAL</text>
    <text x="50" y="38" class="text-secondary text-small" text-anchor="middle">(Write-Ahead Log)</text>
  </g>

  <!-- Memtable Box -->
  <g transform="translate(200, 180)">
    <rect x="0" y="0" width="100" height="60" rx="8" class="box-memtable" />
    <text x="50" y="35" class="text-primary text-label" text-anchor="middle">Memtable</text>
  </g>

  <!-- Immutable Memtable Box -->
  <g transform="translate(200, 280)">
    <rect x="0" y="0" width="100" height="60" rx="8" class="box-memtable" style="opacity: 0.7;" />
    <text x="50" y="25" class="text-primary text-label" text-anchor="middle">Immutable</text>
    <text x="50" y="45" class="text-primary text-label" text-anchor="middle">Memtable</text>
  </g>

  <!-- SSTable Level 0 -->
  <g transform="translate(380, 180)">
    <rect x="0" y="0" width="120" height="60" rx="8" class="box-sstable" />
    <text x="60" y="25" class="text-primary text-label" text-anchor="middle">SSTable</text>
    <text x="60" y="45" class="text-secondary text-small" text-anchor="middle">Level 0</text>
  </g>

  <!-- SSTable Level 1 -->
  <g transform="translate(380, 280)">
    <rect x="0" y="0" width="120" height="60" rx="8" class="box-sstable" />
    <text x="60" y="25" class="text-primary text-label" text-anchor="middle">SSTable</text>
    <text x="60" y="45" class="text-secondary text-small" text-anchor="middle">Level 1</text>
  </g>

  <!-- SSTable Level N -->
  <g transform="translate(380, 380)">
    <rect x="0" y="0" width="120" height="60" rx="8" class="box-sstable" />
    <text x="60" y="25" class="text-primary text-label" text-anchor="middle">SSTable</text>
    <text x="60" y="45" class="text-secondary text-small" text-anchor="middle">Level N</text>
  </g>

  <!-- Ellipsis between levels -->
  <text x="440" y="360" class="text-secondary" text-anchor="middle" font-size="24">...</text>

  <!-- Compaction Process Box -->
  <g transform="translate(580, 260)">
    <rect x="0" y="0" width="140" height="80" rx="8" class="box-fill box-stroke" style="stroke-dasharray: 5,5;" />
    <text x="70" y="30" class="text-primary text-label" text-anchor="middle">Compaction</text>
    <text x="70" y="50" class="text-secondary text-small" text-anchor="middle">Minor &amp; Major</text>
    <text x="70" y="68" class="text-secondary text-small" text-anchor="middle">(Background)</text>
  </g>

  <!-- Write Path Arrows -->
  <!-- Client to Memtable -->
  <path d="M 150 210 L 195 210" class="arrow" style="marker-end: url(#arrowhead);" />

  <!-- Memtable to WAL (parallel write) -->
  <path d="M 165 195 L 165 125 L 195 125" class="arrow arrow-wal" style="marker-end: url(#arrowhead-wal);" />

  <!-- Memtable to Immutable Memtable -->
  <path d="M 250 245 L 250 275" class="arrow" style="marker-end: url(#arrowhead);" />

  <!-- Immutable Memtable to SSTable L0 -->
  <path d="M 305 310 L 375 310 L 375 230" class="arrow" style="marker-end: url(#arrowhead);" />

  <!-- Read Path Arrows -->
  <!-- Client to Memtable (read) -->
  <path d="M 150 220 L 195 220" class="arrow arrow-read" style="marker-end: url(#arrowhead-read);" />

  <!-- Memtable to SSTable L0 (read path) -->
  <path d="M 305 200 L 375 200" class="arrow arrow-read" style="marker-end: url(#arrowhead-read);" />

  <!-- SSTable L0 to L1 (read path) -->
  <path d="M 440 245 L 440 275" class="arrow arrow-read" style="marker-end: url(#arrowhead-read);" />

  <!-- SSTable L1 to LN (read path) -->
  <path d="M 440 345 L 440 375" class="arrow arrow-read" style="marker-end: url(#arrowhead-read);" />

  <!-- Compaction Arrows -->
  <!-- SSTable L0 to Compaction -->
  <path d="M 505 210 L 575 280" class="arrow arrow-compact" style="marker-end: url(#arrowhead-compact);" />

  <!-- SSTable L1 to Compaction -->
  <path d="M 505 310 L 575 300" class="arrow arrow-compact" style="marker-end: url(#arrowhead-compact);" />

  <!-- Compaction to SSTable L1 (output) -->
  <path d="M 580 320 L 510 340 L 505 325" class="arrow arrow-compact" style="marker-end: url(#arrowhead-compact);" />

  <!-- Flow Labels -->
  <text x="175" y="198" class="text-secondary text-small" text-anchor="middle">Write</text>
  <text x="175" y="233" class="text-secondary text-small" text-anchor="middle">Read</text>
  <text x="340" y="195" class="text-secondary text-small" text-anchor="middle">Flush</text>
  <text x="340" y="305" class="text-secondary text-small" text-anchor="middle">Flush</text>

  <!-- Data Flow Description -->
  <g transform="translate(50, 460)">
    <text x="0" y="0" class="text-secondary text-small">
      <tspan x="0" dy="0">Write: Client writes to Memtable (with WAL) which flushes to SSTables when full.</tspan>
    </text>
    <text x="0" y="18" class="text-secondary text-small">
      <tspan x="0" dy="0">Read: Client reads from Memtable first, then searches through SSTable levels.</tspan>
    </text>
  </g>
</svg>
