<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="LSM Tree Architecture Diagram showing data flow through WAL, Memtable, and SSTable components">
  <title>LSM Tree Architecture</title>
  <desc>A diagram showing the LSM Tree storage architecture with Write-Ahead Log (WAL), Memtable, and SSTable components, including both write and read paths.</desc>

  <defs>
    <linearGradient id="walGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="memtableGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="sstableGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.2" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d35400"/>
    </marker>
    <marker id="arrowheadBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3498db"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#ecf0f1" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">LSM Tree Architecture</text>

  <!-- Write Path Section -->
  <text x="50" y="80" fill="#d35400" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Write Path</text>

  <!-- Client -->
  <rect x="50" y="100" width="100" height="60" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  <text x="100" y="135" text-anchor="middle" fill="#ecf0f1" font-family="system-ui, sans-serif" font-size="14">Client</text>

  <!-- Write Arrow to WAL -->
  <line x1="150" y1="130" x2="190" y2="130" stroke="#d35400" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- WAL Component -->
  <rect x="200" y="100" width="140" height="60" rx="8" fill="url(#walGradient)" stroke="#e74c3c" stroke-width="2"/>
  <text x="270" y="125" text-anchor="middle" fill="#e74c3c" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">WAL</text>
  <text x="270" y="145" text-anchor="middle" fill="#bdc3c7" font-family="system-ui, sans-serif" font-size="10">Write-Ahead Log</text>

  <!-- Arrow to Memtable -->
  <line x1="340" y1="130" x2="380" y2="130" stroke="#d35400" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Memtable Component -->
  <rect x="390" y="100" width="140" height="60" rx="8" fill="url(#memtableGradient)" stroke="#f39c12" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" fill="#f39c12" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Memtable</text>
  <text x="460" y="145" text-anchor="middle" fill="#bdc3c7" font-family="system-ui, sans-serif" font-size="10">In-Memory Store</text>

  <!-- Arrow to SSTable -->
  <line x1="530" y1="130" x2="570" y2="130" stroke="#d35400" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- SSTable Component -->
  <rect x="580" y="100" width="140" height="60" rx="8" fill="url(#sstableGradient)" stroke="#27ae60" stroke-width="2"/>
  <text x="650" y="125" text-anchor="middle" fill="#27ae60" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">SSTable</text>
  <text x="650" y="145" text-anchor="middle" fill="#bdc3c7" font-family="system-ui, sans-serif" font-size="10">On-Disk Storage</text>

  <!-- Read Path Section -->
  <text x="50" y="220" fill="#3498db" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Read Path</text>

  <!-- Client for read -->
  <rect x="50" y="240" width="100" height="60" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
  <text x="100" y="275" text-anchor="middle" fill="#ecf0f1" font-family="system-ui, sans-serif" font-size="14">Client</text>

  <!-- Read Arrow to Memtable -->
  <line x1="150" y1="270" x2="380" y2="270" stroke="#3498db" stroke-width="2" marker-end="url(#arrowheadBlue)"/>
  <text x="265" y="260" text-anchor="middle" fill="#3498db" font-family="system-ui, sans-serif" font-size="10">1. Check first</text>

  <!-- Memtable for Read -->
  <rect x="390" y="240" width="140" height="60" rx="8" fill="url(#memtableGradient)" stroke="#f39c12" stroke-width="2"/>
  <text x="460" y="265" text-anchor="middle" fill="#f39c12" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Memtable</text>
  <text x="460" y="285" text-anchor="middle" fill="#bdc3c7" font-family="system-ui, sans-serif" font-size="10">Fast Lookup</text>

  <!-- Read Arrow to SSTable -->
  <line x1="530" y1="270" x2="570" y2="270" stroke="#3498db" stroke-width="2" marker-end="url(#arrowheadBlue)"/>
  <text x="550" y="260" text-anchor="middle" fill="#3498db" font-family="system-ui, sans-serif" font-size="10">2. If miss</text>

  <!-- SSTable for Read -->
  <rect x="580" y="240" width="140" height="60" rx="8" fill="url(#sstableGradient)" stroke="#27ae60" stroke-width="2"/>
  <text x="650" y="265" text-anchor="middle" fill="#27ae60" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">SSTable</text>
  <text x="650" y="285" text-anchor="middle" fill="#bdc3c7" font-family="system-ui, sans-serif" font-size="10">Disk Read</text>

  <!-- Legend -->
  <rect x="50" y="340" width="700" height="50" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="1"/>

  <circle cx="100" cy="365" r="8" fill="#e74c3c"/>
  <text x="120" y="370" fill="#ecf0f1" font-family="system-ui, sans-serif" font-size="12">WAL - Durability</text>

  <circle cx="280" cy="365" r="8" fill="#f39c12"/>
  <text x="300" y="370" fill="#ecf0f1" font-family="system-ui, sans-serif" font-size="12">Memtable - Speed</text>

  <circle cx="470" cy="365" r="8" fill="#27ae60"/>
  <text x="490" y="370" fill="#ecf0f1" font-family="system-ui, sans-serif" font-size="12">SSTable - Persistence</text>

  <line x1="650" y1="360" x2="680" y2="360" stroke="#d35400" stroke-width="2"/>
  <text x="690" y="365" fill="#ecf0f1" font-family="system-ui, sans-serif" font-size="12">Write</text>

  <line x1="650" y1="378" x2="680" y2="378" stroke="#3498db" stroke-width="2"/>
  <text x="690" y="383" fill="#ecf0f1" font-family="system-ui, sans-serif" font-size="12">Read</text>
</svg>
