<!--
  Head Include - SEO and Meta Tags
  Owner: Scenario 11 - SEO and Meta Tags

  Expected elements:
  - charset and viewport meta tags
  - title tag with site.title
  - meta description
  - Open Graph tags (og:title, og:description, og:image, og:url)
  - Twitter Card tags
  - Favicon links
  - CSS stylesheet link
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- SEO Title: Contains 'MirDB' and is under 60 characters -->
<title>{{ page.title | default: site.title }}</title>

<!-- Meta Description: 150-160 characters describing MirDB -->
<meta name="description" content="{{ page.description | default: site.description }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph Tags for Social Sharing -->
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
<meta property="og:image:alt" content="MirDB - Persistent Key-Value Store">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter Card Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}">
<meta name="twitter:image:alt" content="MirDB - Persistent Key-Value Store">

<!-- Favicon Links -->
<link rel="icon" type="image/x-icon" href="{{ '/assets/images/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/og-image.png' | relative_url }}">

<!-- CSS Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
