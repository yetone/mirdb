<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found - MirDB">
  <title>404 - Page Not Found | MirDB</title>
  <link rel="stylesheet" href="./styles/variables.css">
  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/typography.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/utilities.css">
  <link rel="stylesheet" href="./components/Header/Header.css">
  <link rel="stylesheet" href="./components/Navigation/Navigation.css">
  <link rel="stylesheet" href="./components/Footer/Footer.css">
  <link rel="stylesheet" href="./components/ThemeToggle/ThemeToggle.css">
  <!-- Critical inline styles for immediate rendering -->
  <style>
    /* Critical CSS for 404 page */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background-color: var(--color-background, #ffffff);
      color: var(--color-text, #1e293b);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      padding-top: 80px; /* Space for fixed header */
    }

    .error-page {
      text-align: center;
      max-width: 500px;
    }

    .error-page__code {
      font-size: 6rem;
      font-weight: 700;
      color: var(--color-error, #ef4444);
      line-height: 1;
      margin-bottom: 1rem;
    }

    .error-page__title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .error-page__description {
      color: var(--color-text-muted, #64748b);
      margin-bottom: 2rem;
    }

    .error-page__link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background-color: var(--color-primary, #1d4ed8);
      color: white;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 150ms ease;
    }

    .error-page__link:hover {
      background-color: var(--color-primary-hover, #1e40af);
    }

    .error-page__link:focus-visible {
      outline: 2px solid var(--color-focus, #3b82f6);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!-- Skip to main content link for accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header with navigation -->
  <header class="header" id="header" role="banner">
    <nav class="nav" role="navigation" aria-label="Main navigation">
      <a href="/" class="nav__logo" aria-label="MirDB - Go to homepage">
        <span class="nav__logo-text">MirDB</span>
      </a>

      <!-- Desktop navigation -->
      <ul class="nav__menu" id="nav-menu">
        <li class="nav__item">
          <a href="/" class="nav__link">Home</a>
        </li>
        <li class="nav__item">
          <a href="/#features" class="nav__link">Features</a>
        </li>
        <li class="nav__item">
          <a href="/#about" class="nav__link">About</a>
        </li>
        <li class="nav__item">
          <a href="/#contact" class="nav__link">Contact</a>
        </li>
      </ul>

      <!-- Theme toggle button -->
      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Toggle dark mode"
        aria-pressed="false"
        data-testid="theme-toggle"
      >
        <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </span>
        <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
        <span class="visually-hidden">Toggle dark mode</span>
      </button>

      <!-- Hamburger menu button for mobile -->
      <button
        class="nav__toggle"
        id="nav-toggle"
        aria-label="Toggle navigation menu"
        aria-expanded="false"
        aria-controls="nav-menu"
      >
        <span class="nav__toggle-icon"></span>
      </button>
    </nav>
  </header>

  <!-- Main content -->
  <main id="main-content" role="main" data-testid="error-page">
    <div class="error-page">
      <div class="error-page__code" aria-hidden="true">404</div>
      <h1 class="error-page__title">Page Not Found</h1>
      <p class="error-page__description">
        Sorry, we couldn't find the page you're looking for.
        It may have been moved or doesn't exist.
      </p>
      <a href="/" class="error-page__link">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Back to Homepage
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="footer__content">
      <p class="footer__copyright">&copy; 2026 MirDB. All rights reserved.</p>
      <nav class="footer__links" aria-label="Footer navigation">
        <a href="/privacy" class="footer__link">Privacy Policy</a>
        <a href="/terms" class="footer__link">Terms of Service</a>
        <a href="/#contact" class="footer__link">Contact</a>
        <a href="https://github.com/mirdb/mirdb" class="footer__link footer__link--social" aria-label="MirDB on GitHub">
          <svg class="footer__icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          GitHub
        </a>
      </nav>
    </div>
  </footer>

  <style>
    /* Footer styles from index.html for consistency */
    .footer {
      padding: var(--spacing-8, 2rem);
      text-align: center;
      border-top: 1px solid var(--color-border, #e2e8f0);
    }

    .footer__content {
      max-width: 1200px;
      margin: 0 auto;
    }

    .footer__links {
      margin-top: var(--spacing-4, 1rem);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--spacing-6, 1.5rem);
    }

    .footer__link {
      color: var(--color-text-muted, #64748b);
      transition: color 150ms ease;
      text-decoration: none;
    }

    .footer__link:hover {
      color: var(--color-primary, #1d4ed8);
    }
  </style>

  <script type="module" src="./components/Navigation/Navigation.js"></script>
  <script type="module" src="./scripts/main.js"></script>
  <script type="module" src="./components/ThemeToggle/ThemeToggle.js"></script>
</body>
</html>
