<!--
  Technical Specifications Section
  Owner: Scenario 5 - Configuration Display

  This file contains the HTML structure for the Technical Specifications section.
  The content is embedded directly in index.html.

  Configuration values displayed:
  - Default port (12333)
  - Work directory path (/tmp/mirdb)
  - SSTable max size (100 MB)
  - Memtable max size (4 MB)
  - Block size (4 KB)
  - Max LSM levels (7)

  Requirements: REQ-6
-->

<section id="techspecs" class="techspecs">
  <div class="container">
    <h2 class="techspecs__title">Default Configuration</h2>
    <div class="techspecs__grid">
      <div class="techspecs__item">
        <dt class="techspecs__label">Port</dt>
        <dd class="techspecs__value">12333</dd>
      </div>
      <div class="techspecs__item">
        <dt class="techspecs__label">Work Directory</dt>
        <dd class="techspecs__value">/tmp/mirdb</dd>
      </div>
      <div class="techspecs__item">
        <dt class="techspecs__label">SSTable Max Size</dt>
        <dd class="techspecs__value">100 MB</dd>
      </div>
      <div class="techspecs__item">
        <dt class="techspecs__label">Memtable Max Size</dt>
        <dd class="techspecs__value">4 MB</dd>
      </div>
      <div class="techspecs__item">
        <dt class="techspecs__label">Block Size</dt>
        <dd class="techspecs__value">4 KB</dd>
      </div>
      <div class="techspecs__item">
        <dt class="techspecs__label">Max LSM Levels</dt>
        <dd class="techspecs__value">7</dd>
      </div>
    </div>
  </div>
</section>
