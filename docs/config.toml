# Hugo configuration for MirDB Homepage

baseURL = "https://yetone.github.io/mirdb/"
languageCode = "en-us"
title = "MirDB - Persistent Key-Value Store with Memcached Protocol"

# Build configuration
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[build]
  writeStats = true

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true

[params]
  description = "MirDB is a persistent key-value store with Memcached protocol support, using LSM tree architecture for high performance."
  author = "MirDB Contributors"
  githubUrl = "https://github.com/yetone/mirdb"
