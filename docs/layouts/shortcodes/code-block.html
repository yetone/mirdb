{{/*
  Code block shortcode with copy functionality
  Owner: Scenario 5 - Getting Started Section
  Usage: {{< code-block lang="shell" >}}cargo build{{< /code-block >}}
*/}}
<div class="code-block-wrapper relative">
  <pre class="language-{{ .Get "lang" | default "text" }}"><code>{{ .Inner | safeHTML }}</code></pre>
  <button class="copy-button absolute top-2 right-2 p-2 bg-gray-700 hover:bg-gray-600 rounded text-white text-sm" aria-label="Copy to clipboard">
    Copy
  </button>
</div>
