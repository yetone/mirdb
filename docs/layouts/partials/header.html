{{/*
  Header partial for MirDB Homepage
  Owner: Scenario 1 - Header and Navigation
  TODO: Implement header with logo, nav, theme toggle
*/}}
<header class="bg-white dark:bg-dark-bg border-b border-gray-200 dark:border-gray-700 sticky top-0 z-40">
  <nav class="container-custom flex items-center justify-between h-16" aria-label="Main navigation">
    <a href="{{ "/" | relURL }}" class="flex items-center space-x-2">
      <img src="{{ "images/logo.gif" | relURL }}" alt="MirDB Logo" class="h-8 w-auto">
      <span class="font-bold text-xl">MirDB</span>
    </a>

    <div class="hidden md:flex items-center space-x-6">
      <a href="#features" class="text-gray-600 dark:text-gray-300 hover:text-primary-600">Features</a>
      <a href="#architecture" class="text-gray-600 dark:text-gray-300 hover:text-primary-600">Architecture</a>
      <a href="#getting-started" class="text-gray-600 dark:text-gray-300 hover:text-primary-600">Getting Started</a>
      <a href="#status" class="text-gray-600 dark:text-gray-300 hover:text-primary-600">Status</a>
      <a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener noreferrer" class="text-gray-600 dark:text-gray-300 hover:text-primary-600">GitHub</a>
      <button id="theme-toggle" aria-label="Toggle dark mode" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
        </svg>
      </button>
    </div>

    <button id="mobile-menu-button" class="md:hidden p-2" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </nav>

  <div id="mobile-menu" class="hidden md:hidden border-t border-gray-200 dark:border-gray-700">
    <div class="container-custom py-4 space-y-2">
      <a href="#features" class="block py-2 text-gray-600 dark:text-gray-300">Features</a>
      <a href="#architecture" class="block py-2 text-gray-600 dark:text-gray-300">Architecture</a>
      <a href="#getting-started" class="block py-2 text-gray-600 dark:text-gray-300">Getting Started</a>
      <a href="#status" class="block py-2 text-gray-600 dark:text-gray-300">Status</a>
      <a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener noreferrer" class="block py-2 text-gray-600 dark:text-gray-300">GitHub</a>
    </div>
  </div>
</header>
