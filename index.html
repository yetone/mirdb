<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="MirDB - A persistent key-value store with Memcached protocol compatibility, powered by Rust">
  <title>MirDB - Persistent Key-Value Store with Memcached Protocol</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <!-- Hero Section -->
    <section class="hero" data-testid="hero-section">
      <div class="hero-content">
        <div class="hero-branding">
          <img
            src="assets/logo.gif"
            alt="MirDB Logo"
            class="hero-logo"
            data-testid="hero-logo"
          >
          <h1 class="hero-title" data-testid="hero-title">MirDB</h1>
        </div>
        <p class="hero-tagline" data-testid="hero-tagline">
          Persistent Key-Value Store with Memcached Protocol
        </p>
        <div class="hero-cta-buttons">
          <a
            href="#get-started"
            class="btn btn-primary"
            data-testid="cta-get-started"
          >
            Get Started
          </a>
          <a
            href="https://github.com/yetone/mirdb"
            class="btn btn-secondary"
            data-testid="cta-github"
            target="_blank"
            rel="noopener noreferrer"
          >
            View on GitHub
          </a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
