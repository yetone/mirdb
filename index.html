<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirDB - Persistent Key-Value Store with Memcached Protocol Support</title>
    <meta name="description" content="MirDB is a persistent key-value store with Memcached protocol support, built in Rust for high performance and reliability.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero-section" id="hero">
        <div class="hero-content">
            <div class="hero-logo">
                <img src="assets/logo.gif" alt="MirDB animated logo showing database operations" class="logo-image">
            </div>
            <h1 class="hero-title">MirDB</h1>
            <p class="hero-tagline">Persistent Key-Value Store with Memcached Protocol Support</p>
            <div class="hero-actions">
                <button class="btn btn-primary" id="get-started-btn" onclick="scrollToSection('quick-start')">
                    Get Started
                </button>
                <a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" id="github-btn">
                    View on GitHub
                </a>
            </div>
        </div>
    </header>

    <main>
        <section id="quick-start" class="quick-start-section">
            <div class="container">
                <h2>Quick Start</h2>
                <p>Get started with MirDB in minutes.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
