<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MirDB: A persistent key-value store with Memcached protocol compatibility. The familiarity of memcached with the reliability of persistent storage.">
    <meta name="keywords" content="MirDB, key-value store, memcached, persistent storage, LSM tree, database, Rust">
    <title>MirDB - Persistent Key-Value Store with Memcached Protocol</title>
    <style>
        :root {
            --primary-color: #2d5aa3;
            --primary-hover: #1e4080;
            --secondary-color: #6c757d;
            --secondary-hover: #5a6268;
            --text-color: #333;
            --text-light: #666;
            --bg-color: #fff;
            --bg-light: #f8f9fa;
            --border-color: #e9ecef;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--primary-color);
        }

        /* Hero Section */
        .hero {
            padding: 4rem 0;
            text-align: center;
            background: linear-gradient(180deg, var(--bg-light) 0%, var(--bg-color) 100%);
        }

        .hero-logo {
            max-width: 300px;
            height: auto;
            margin-bottom: 2rem;
        }

        .hero-headline {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .hero-subheadline {
            font-size: 1.25rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-cta {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-color);
            color: white;
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }

        .badge-container {
            margin-top: 1rem;
        }

        .badge-container img {
            height: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                gap: 1rem;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }

            .hero-headline {
                font-size: 1.75rem;
            }

            .hero-subheadline {
                font-size: 1rem;
            }

            .hero-logo {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo-text">MirDB</a>
            <nav>
                <ul>
                    <li><a href="#features">Features</a></li>
                    <li><a href="#quickstart">Quick Start</a></li>
                    <li><a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener">GitHub</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <img src="assets/logo.gif" alt="MirDB Logo" class="hero-logo" loading="lazy">
            <h1 class="hero-headline">MirDB: A Persistent Key-Value Store with Memcached Protocol</h1>
            <p class="hero-subheadline">The familiarity of memcached with the reliability of persistent storage</p>
            <div class="hero-cta">
                <a href="#quickstart" class="btn btn-primary">Get Started</a>
                <a href="https://github.com/yetone/mirdb" class="btn btn-secondary" target="_blank" rel="noopener">View on GitHub</a>
            </div>
            <div class="badge-container">
                <a href="https://circleci.com/gh/yetone/mirdb" target="_blank" rel="noopener">
                    <img src="https://atompunk.yetone.fun/github/yetone/mirdb?v=2" alt="CircleCI Status">
                </a>
            </div>
        </div>
    </section>
</body>
</html>
