<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MirDB - A persistent key-value store with Memcached protocol compatibility. Drop-in replacement with LSM tree architecture.">
    <title>MirDB - Persistent Memcached-compatible Key-Value Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --bg-light: #f9fafb;
            --white: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text-dark);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--white) 100%);
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        .hero .tagline {
            font-size: 1.5rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .hero .value-proposition {
            font-size: 1.125rem;
            color: var(--text-dark);
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.875rem 2rem;
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: var(--white);
            color: var(--text-dark);
            border: 2px solid var(--text-light);
        }

        .btn-secondary:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .hero .tagline {
                font-size: 1.25rem;
            }

            .hero .value-proposition {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2rem;
            }

            .hero .tagline {
                font-size: 1rem;
            }

            .cta-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <section class="hero" data-testid="hero-section">
        <div class="hero-content">
            <h1 data-testid="hero-product-name">MirDB</h1>
            <p class="tagline" data-testid="hero-tagline">Persistent Memcached-compatible key-value store</p>
            <p class="value-proposition" data-testid="hero-value-proposition">
                Drop-in Memcached replacement with persistent storage. Built with Rust for performance and safety,
                featuring LSM tree architecture for write-optimized workloads.
            </p>
            <div class="cta-buttons">
                <a href="#getting-started" class="btn btn-primary" data-testid="hero-cta-primary">Get Started</a>
                <a href="https://github.com/yetone/mirdb" class="btn btn-secondary" data-testid="hero-cta-github" target="_blank" rel="noopener noreferrer">View on GitHub</a>
            </div>
        </div>
    </section>
</body>
</html>
