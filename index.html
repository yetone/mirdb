<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MirDB - A Persistent Key-Value Store with Memcached Protocol</title>
    <meta name="description" content="MirDB is a persistent key-value store with Memcached protocol support. High-performance, reliable storage with familiar memcached interface.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            max-width: 1200px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .hero-logo {
            width: 200px;
            height: 200px;
            margin-bottom: 2rem;
            animation: fadeIn 1s ease-in;
        }

        .hero-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(102, 76, 162, 0.3);
        }

        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            color: #2c76bca;
            margin-bottom: 1rem;
            animation: slideUp 0.8s ease-out;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-tagline {
            font-size: 1.5rem;
            color: #555;
            max-width: 800px;
            margin-bottom: 2rem;
            animation: slideUp 1s ease-out 0.2s both;
            line-height: 1.8;
        }

        .hero-cta {
            display: flex;
            gap: 1rem;
            animation: slideUp 1s ease-out 0.4s both;
            flex-wrap: wrap;
            justify-content: center;
        }

        .cta-button {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .cta-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .cta-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .cta-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .cta-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .status-badge {
            margin-top: 2rem;
            animation: fadeIn 1.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tablet */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 3rem;
            }

            .hero-tagline {
                font-size: 1.3rem;
            }

            .hero-logo {
                width: 150px;
                height: 150px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .hero-tagline {
                font-size: 1.1rem;
            }

            .hero-logo {
                width: 120px;
                height: 120px;
            }

            .hero-cta {
                flex-direction: column;
                width: 100%;
            }

            .cta-button {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="hero-section" data-testid="hero-section">
            <div class="hero-logo">
                <img src="assets/logo.gif" alt="MirDB Logo" data-testid="hero-logo">
            </div>

            <h1 class="hero-title" data-testid="hero-title">MirDB</h1>

            <p class="hero-tagline" data-testid="hero-tagline">
                A persistent key-value store with Memcached protocol support
            </p>

            <div class="hero-cta">
                <a href="#getting-started" class="cta-button cta-primary" data-testid="cta-get-started">
                    Get Started
                </a>
                <a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener noreferrer" class="cta-button cta-secondary" data-testid="cta-github">
                    View on GitHub
                </a>
            </div>

            <div class="status-badge">
                <img src="https://atompunk.yetone.fun/github/yetone/mirdb?v=2" alt="Build Status" data-testid="status-badge">
            </div>
        </section>
    </main>
</body>
</html>
