<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - MirDB">
    <title>404 - Page Not Found | MirDB</title>

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="404 - Page Not Found | MirDB">
    <meta property="og:description" content="The page you are looking for could not be found.">

    <link rel="stylesheet" href="styles.css">
    <style>
        /* 404-specific styles */
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .error-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: var(--spacing-lg) var(--spacing-md);
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary) 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: var(--spacing-sm);
        }

        .error-title {
            font-size: 2rem;
            color: var(--color-text);
            margin-bottom: var(--spacing-sm);
        }

        .error-message {
            font-size: 1.125rem;
            color: var(--color-text-muted);
            max-width: 500px;
            margin-bottom: var(--spacing-lg);
        }

        .error-actions {
            display: flex;
            gap: var(--spacing-sm);
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-actions {
                flex-direction: column;
                width: 100%;
                max-width: 250px;
            }

            .error-actions .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body class="error-page">
    <main class="error-content" role="main">
        <div class="error-code" aria-hidden="true">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <div class="error-actions">
            <a href="/" class="btn btn-primary" id="home-link">Back to Homepage</a>
            <a href="https://github.com/yetone/mirdb" class="btn btn-secondary" target="_blank" rel="noopener">View on GitHub</a>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 MirDB Project. Licensed under MIT.</p>
            <nav class="footer-links">
                <a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener">GitHub</a>
                <a href="https://github.com/yetone/mirdb#readme" target="_blank" rel="noopener">Documentation</a>
                <a href="https://github.com/yetone/mirdb" target="_blank" rel="noopener">License</a>
            </nav>
        </div>
    </footer>
</body>
</html>
